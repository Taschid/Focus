[Metadata]
Name=Focus
Author=jcode
Information=Local focus tracker card. The daemon (tools\focus\focus.py) writes logs\focus_status.txt; this skin only reads it and never writes. The circular ring is a stopwatch of the current work stretch: it fills over a 25 minute focus block, turns amber once the block is done and red at the 45 minute break point. The KEEP WORK chip is a manual hold: while it is on, play apps (Discord, Spotify, a video) no longer end the working stretch. Categories and their colours are the same ones ActivityWatch uses (focus_aw_sync.py --push keeps both in step).
Version=2.1

[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
; WebParser polls the file on its own UpdateRate; this just primes it on load.
OnRefreshAction=[!CommandMeasure mFile "Update"]
ContextTitle=Mark this app as work
ContextAction=[!CommandMeasure cmdMarkWork Run]
ContextTitle2=Mark this app as play
ContextAction2=[!CommandMeasure cmdMarkNotWork Run]
ContextTitle3=Open tracker folder
ContextAction3=["#ToolsRoot#\focus"]
ContextTitle4=Keep working (manual hold on/off)
ContextAction4=[!CommandMeasure cmdHold Run]
ContextTitle5=Distraction grace: 5 min
ContextAction5=[!CommandMeasure cmdGrace5 Run]
ContextTitle6=Distraction grace: 10 min
ContextAction6=[!CommandMeasure cmdGrace10 Run]
ContextTitle7=Distraction grace: 15 min
ContextAction7=[!CommandMeasure cmdGrace15 Run]

[Variables]
; Same palette and type scale as the Sensibo Air, Weather and Gree AC cards.
Face=Segoe UI
SizeLabel=9
SizeBig=26
ColorLabel=140,140,145,255
ColorValue=232,232,236,255
ColorGood=255,255,255,255
ColorAmber=235,170,60,255
ColorBad=255,107,107,255
; Category colours. Identical to COLORS in Tools\focus\focus_aw_sync.py, so a
; category is the same colour on this card and in ActivityWatch.
ColorCoding=0,225,255,255
ColorUniversity=167,139,250,255
ColorAdmin=103,232,249,255
ColorWork=74,222,128,255
ColorPlay=244,114,182,255
ColorExcluded=140,140,145,255
ColorOther=140,140,145,255
ChipBack=30,30,34,255
RuleColor=60,60,64,255
ColorRingTrack=34,34,38,255
; Manual override ring: a cyan circle outside the timer while HOLD is on.
ColorHoldBlue=0,225,255,255
Pad=14
W=244
H=296
; Set this to the folder that holds your toolkits (the skin expects
; #ToolsRoot#\focus to contain focus.py and a venv). Use forward slashes.
ToolsRoot=C:\Tools
; Colour of the little state dot next to the title; rewritten by [mStateTone].
DotColor=140,140,145,255
Venv=#ToolsRoot#\focus\venv\Scripts\pythonw.exe
Script=#ToolsRoot#\focus\focus.py
FileURL=file:///#ToolsRoot#/focus/logs/focus_status.txt

; ===========================================================================
; Data contract. The daemon owns <ToolsRoot>\focus\logs\focus_status.txt.
; One line, UTF-8, 15 pipe-separated fields in this order:
;   state|project|app|stretch|work_today|work_week|day_bars|seated|break_due|idle_s|paused|written|error|stretch_s|held
;   state: working | notworking | idle | paused
;   stretch, work_today, work_week, seated: already formatted ("1h 12m", "48m", "0m")
;   day_bars: 7 comma-separated integer minutes, oldest -> today (kept for the TUI, not shown here)
;   break_due: 0|1 (1 = stretch 45 min or more)
;   written: epoch seconds; error: empty on success, otherwise short text
;   stretch_s: raw seconds of the current stretch; the ring ticks from this
;   held: 1 while the manual "keep working" hold is on, else 0
; [mFile] captures exactly these 15 groups, in this order, and nothing else.
; ===========================================================================

[mFile]
Measure=Plugin
Plugin=WebParser
URL=#FileURL#
UpdateRate=5
RegExp=(?siU)^(.*?)\|(.*?)\|(.*?)\|(.*?)\|(.*?)\|(.*?)\|(.*?)\|(.*?)\|(.*?)\|(.*?)\|(.*?)\|(.*?)\|(.*?)\|(.*?)\|(.*?)\s*$
; A missing or unwritten file must not take the card down: the title says so.
OnRegExpErrorAction=[!SetOption MeterTitle Text "FOCUS  offline"][!UpdateMeter MeterTitle][!Redraw]
FinishAction=[!SetOption MeterTitle Text "FOCUS"][!UpdateMeasureGroup Vals][!UpdateMeterGroup StateBits][!UpdateMeter MeterProject][!UpdateMeter MeterApp][!UpdateMeter MeterTodayValue][!UpdateMeter MeterSeated][!UpdateMeter MeterStale][!UpdateMeter MeterHoldWord][!Redraw]

; --- the contract fields the card shows ------------------------------------
[mState]
Measure=Plugin
Plugin=WebParser
URL=[mFile]
StringIndex=1
Group=Vals

[mProject]
Measure=Plugin
Plugin=WebParser
URL=[mFile]
StringIndex=2
Group=Vals
; "Unknown" is the tracker's "no rule yet" bucket; ActivityWatch calls the
; same bucket "Other", so the card says "Other" too.
Substitute="":"--","Unknown":"Other"

[mApp]
Measure=Plugin
Plugin=WebParser
URL=[mFile]
StringIndex=3
Group=Vals
Substitute="":"--"

[mWorkToday]
Measure=Plugin
Plugin=WebParser
URL=[mFile]
StringIndex=5
Group=Vals
Substitute="":"--"

[mSeated]
Measure=Plugin
Plugin=WebParser
URL=[mFile]
StringIndex=8
Group=Vals
Substitute="":"--"

[mBreakDue]
Measure=Plugin
Plugin=WebParser
URL=[mFile]
StringIndex=9
Group=Vals

[mWritten]
Measure=Plugin
Plugin=WebParser
URL=[mFile]
StringIndex=12
Group=Vals

; Raw stretch seconds. The ring needs sub-minute resolution; the formatted
; "stretch" field above stays in the contract for the TUI and the mirror.
[mStretchS]
Measure=Plugin
Plugin=WebParser
URL=[mFile]
StringIndex=14
Group=Vals

; Manual keep-working latch. 1 while the user holds the stretch through play
; apps; the KEEP WORK chip below toggles it and shows HOLD ON when active.
[mHeld]
Measure=Plugin
Plugin=WebParser
URL=[mFile]
StringIndex=15
Group=Vals
Substitute="":"0"

[mHoldWord]
Measure=String
String=[mHeld]
Substitute="1":"HOLD ON","0":"KEEP WORK","":"KEEP WORK"
DynamicVariables=1

; Amber while the hold is on, label grey when it is off.
[mHoldTone]
Measure=String
String=[mHeld]
DynamicVariables=1
IfMatch=^1$
IfMatchAction=[!SetOption MeterHoldWord FontColor "#ColorAmber#"][!ShowMeter MeterHoldRing][!UpdateMeter MeterHoldWord][!UpdateMeter MeterHoldRing][!Redraw]
IfMatch2=^0$
IfMatchAction2=[!SetOption MeterHoldWord FontColor "#ColorLabel#"][!HideMeter MeterHoldRing][!UpdateMeter MeterHoldWord][!Redraw]

; STALE when the daemon has not written for 20 s. A dead tracker must not keep
; claiming "WORKING 4h"; stale.lua compares os.time() with the written field.
[mStale]
Measure=Script
ScriptFile=stale.lua
UpdateDivider=5

; ---------------------------------------------------------------------------
; Circular stopwatch. timer.lua adds the age of the last write while working,
; so the ring and the MM:SS text tick every second between the 5 s file polls.
; Ring returns 0..100 percent of a 25 minute block; Text returns MM:SS.
; ---------------------------------------------------------------------------
[mTimerRing]
Measure=Script
ScriptFile=timer.lua
Mode=Ring
MinValue=0
MaxValue=100
UpdateDivider=1

[mTimerText]
Measure=Script
ScriptFile=timer.lua
Mode=Text
UpdateDivider=1

; The track behind the progress arc: always a full circle.
[mRingFull]
Measure=Calc
Formula=100
MinValue=0
MaxValue=100

; ---------------------------------------------------------------------------
; State -> word and tone. Working is cyan, chilling is green, idle amber,
; paused red. A missing value stays grey and does not claim "working".
; ---------------------------------------------------------------------------
[mStateWord]
Measure=Plugin
Plugin=WebParser
URL=[mFile]
StringIndex=1
Group=Vals
Substitute="notworking":"PLAY","working":"WORKING","idle":"IDLE","paused":"PAUSED","":"IDLE"

; String twin for the IfMatch rules below.
[mStateCode]
Measure=Plugin
Plugin=WebParser
URL=[mFile]
StringIndex=1
Group=Vals
Substitute="notworking":"2","working":"1","idle":"3","paused":"4","":"0"

[mStateTone]
Measure=String
String=[mState]
DynamicVariables=1
IfMatch=^working$
IfMatchAction=[!SetOption MeterState FontColor "0,225,255,255"][!SetOption MeterAccent SolidColor "0,225,255,255"][!SetVariable DotColor "0,225,255,255"][!SetOption MeterHoldRing LineColor "0,225,255,255"][!UpdateMeterGroup StateBits][!UpdateMeter MeterAccent][!UpdateMeter MeterHoldRing][!Redraw]
IfMatch2=^notworking$
IfMatchAction2=[!SetOption MeterState FontColor "110,220,140,255"][!SetOption MeterAccent SolidColor "110,220,140,255"][!SetVariable DotColor "110,220,140,255"][!SetOption MeterHoldRing LineColor "110,220,140,255"][!UpdateMeterGroup StateBits][!UpdateMeter MeterAccent][!UpdateMeter MeterHoldRing][!Redraw]
IfMatch3=^idle$
IfMatchAction3=[!SetOption MeterState FontColor "140,140,145,255"][!SetOption MeterAccent SolidColor "140,140,145,255"][!SetVariable DotColor "140,140,145,255"][!SetOption MeterHoldRing LineColor "140,140,145,255"][!UpdateMeterGroup StateBits][!UpdateMeter MeterAccent][!UpdateMeter MeterHoldRing][!Redraw]
IfMatch4=^paused$
IfMatchAction4=[!SetOption MeterState FontColor "140,140,145,255"][!SetOption MeterAccent SolidColor "140,140,145,255"][!SetVariable DotColor "140,140,145,255"][!SetOption MeterHoldRing LineColor "140,140,145,255"][!UpdateMeterGroup StateBits][!UpdateMeter MeterAccent][!UpdateMeter MeterHoldRing][!Redraw]
IfMatch5=^$
IfMatchAction5=[!SetOption MeterState FontColor "140,140,145,255"][!SetOption MeterAccent SolidColor "140,140,145,255"][!SetVariable DotColor "140,140,145,255"][!SetOption MeterHoldRing LineColor "140,140,145,255"][!UpdateMeterGroup StateBits][!UpdateMeter MeterAccent][!UpdateMeter MeterHoldRing][!Redraw]

; ---------------------------------------------------------------------------
; Category tone. The project label is painted in the same colour ActivityWatch
; gives that category, so both surfaces read the same way at a glance.
; ---------------------------------------------------------------------------
[mProjectTone]
Measure=String
String=[mProject]
DynamicVariables=1
IfMatch=^Coding$
IfMatchAction=[!SetOption MeterProject FontColor "#ColorCoding#"][!UpdateMeter MeterProject][!Redraw]
IfMatch2=^University$
IfMatchAction2=[!SetOption MeterProject FontColor "#ColorUniversity#"][!UpdateMeter MeterProject][!Redraw]
IfMatch3=^Admin$
IfMatchAction3=[!SetOption MeterProject FontColor "#ColorAdmin#"][!UpdateMeter MeterProject][!Redraw]
IfMatch4=^Work$
IfMatchAction4=[!SetOption MeterProject FontColor "#ColorWork#"][!UpdateMeter MeterProject][!Redraw]
IfMatch5=^Play$
IfMatchAction5=[!SetOption MeterProject FontColor "#ColorPlay#"][!UpdateMeter MeterProject][!Redraw]
IfMatch6=^Excluded$
IfMatchAction6=[!SetOption MeterProject FontColor "#ColorExcluded#"][!UpdateMeter MeterProject][!Redraw]
IfMatch7=^(Other|--)$
IfMatchAction7=[!SetOption MeterProject FontColor "#ColorOther#"][!UpdateMeter MeterProject][!Redraw]

; break_due 1 means stretch 45 minutes or more: the seated value goes red.
; 0 is fine, which in this palette is the white/green "good" tone.
[mBreakCode]
Measure=Plugin
Plugin=WebParser
URL=[mFile]
StringIndex=9
Group=Vals
Substitute="1":"1","":"0"

[mBreakTone]
Measure=Calc
Formula=mBreakCode
DynamicVariables=1
IfCondition=mBreakCode = 1
IfTrueAction=[!SetOption MeterSeated FontColor "#ColorBad#"][!UpdateMeter MeterSeated][!Redraw]
IfCondition2=mBreakCode = 0
IfTrueAction2=[!SetOption MeterSeated FontColor "#ColorGood#"][!UpdateMeter MeterSeated][!Redraw]

; ---------------------------------------------------------------------------
; Clicking the state dot toggles tracking. "paused" means off until resume
; (focus.py pause 0), so the dot's red paused tone doubles as the OFF signal.
; The click never hides or unloads the skin.
; ---------------------------------------------------------------------------

; One click flips tracking: OFF -> resumes, ON -> pause 0 (off until resume).
[mToggle]
Measure=Script
ScriptFile=toggle.lua
UpdateDivider=-1

; ---------------------------------------------------------------------------
; Commands. pythonw.exe so no console window flashes; every command re-reads
; the file when it finishes, because the daemon only writes on its own cycle.
; ---------------------------------------------------------------------------
[cmdStand]
Measure=Plugin
Plugin=RunCommand
Program=#Venv#
Parameter=#Script# stand
OutputType=UTF8
State=Hide
UpdateDivider=-1
FinishAction=[!CommandMeasure mFile "Update"][!Redraw]

; pause 0 keeps tracking off until the pill (or focus.py resume) turns it on.
[cmdPauseOff]
Measure=Plugin
Plugin=RunCommand
Program=#Venv#
Parameter=#Script# pause 0
OutputType=UTF8
State=Hide
UpdateDivider=-1
FinishAction=[!CommandMeasure mFile "Update"][!Redraw]

[cmdResume]
Measure=Plugin
Plugin=RunCommand
Program=#Venv#
Parameter=#Script# resume
OutputType=UTF8
State=Hide
UpdateDivider=-1
FinishAction=[!CommandMeasure mFile "Update"][!Redraw]

[cmdMarkWork]
Measure=Plugin
Plugin=RunCommand
Program=#Venv#
Parameter=#Script# mark work
OutputType=UTF8
State=Hide
UpdateDivider=-1
FinishAction=[!CommandMeasure mFile "Update"][!Redraw]

[cmdMarkNotWork]
Measure=Plugin
Plugin=RunCommand
Program=#Venv#
Parameter=#Script# mark play
OutputType=UTF8
State=Hide
UpdateDivider=-1
FinishAction=[!CommandMeasure mFile "Update"][!Redraw]

; Toggle the manual hold. focus.py reads logs\state.json and flips it, so one
; click is enough: KEEP WORK -> HOLD ON -> KEEP WORK.
[cmdHold]
Measure=Plugin
Plugin=RunCommand
Program=#Venv#
Parameter=#Script# hold
OutputType=UTF8
State=Hide
UpdateDivider=-1
FinishAction=[!CommandMeasure mFile "Update"][!Redraw]

; Distraction window: how long a play app may stay in front before PLAY and a
; stretch reset. 5 min is the shipped default; these write config.json and the
; daemon picks the value up live.
[cmdGrace5]
Measure=Plugin
Plugin=RunCommand
Program=#Venv#
Parameter=#Script# grace 5
OutputType=UTF8
State=Hide
UpdateDivider=-1
FinishAction=[!CommandMeasure mFile "Update"][!Redraw]

[cmdGrace10]
Measure=Plugin
Plugin=RunCommand
Program=#Venv#
Parameter=#Script# grace 10
OutputType=UTF8
State=Hide
UpdateDivider=-1
FinishAction=[!CommandMeasure mFile "Update"][!Redraw]

[cmdGrace15]
Measure=Plugin
Plugin=RunCommand
Program=#Venv#
Parameter=#Script# grace 15
OutputType=UTF8
State=Hide
UpdateDivider=-1
FinishAction=[!CommandMeasure mFile "Update"][!Redraw]

; ---------------------------------------------------------------------------
; Styles - mirrors the Sensibo Air / Weather / Gree AC cards
; ---------------------------------------------------------------------------
[StyleLabel]
FontFace=#Face#
FontSize=#SizeLabel#
FontColor=#ColorLabel#
AntiAlias=1

[styleChip]
Meter=Image
SolidColor=#ChipBack#
H=18

[styleBtn]
Meter=String
FontFace=#Face#
FontSize=#SizeLabel#
FontColor=#ColorLabel#
StringAlign=Left
H=18
AntiAlias=1
MouseOverAction=[!SetOption #CURRENTSECTION# FontColor "255,255,255,255"][!UpdateMeter #CURRENTSECTION#][!Redraw]
MouseLeaveAction=[!SetOption #CURRENTSECTION# FontColor "#ColorLabel#"][!UpdateMeter #CURRENTSECTION#][!Redraw]

; ---------------------------------------------------------------------------
; Panel
; ---------------------------------------------------------------------------
[MeterBack]
Meter=Image
SolidColor=16,16,18,205
W=#W#
H=#H#
X=0
Y=0
LeftMouseUpAction=[!CommandMeasure mFile "Update"]
MouseActionCursor=0

[MeterAccent]
Meter=Image
SolidColor=#ColorGood#
W=3
H=#H#
X=0
Y=0

[MeterTitle]
Meter=String
FontFace=#Face#
FontSize=10
FontColor=#ColorValue#
FontWeight=600
X=#Pad#
Y=10
Text="FOCUS"
AntiAlias=1
DynamicVariables=1

[MeterStale]
Meter=String
MeterStyle=StyleLabel
FontColor=#ColorAmber#
StringAlign=Right
X=(#W#-#Pad#)
Y=10
Text="[mStale]"
AntiAlias=1
DynamicVariables=1

; State dot, right of the title. Fill comes from #DotColor#, which [mStateTone]
; rewrites on every state; clicking it toggles tracking.
[MeterDot]
Meter=Shape
Shape=Ellipse 3.5,3.5,3.5 | Fill Color #DotColor# | StrokeWidth 0
X=62
Y=14
Group=StateBits
DynamicVariables=1
LeftMouseUpAction=[!CommandMeasure mToggle "Toggle()"]
ToolTipText="Tracking on/off: click to pause tracking (red dot = paused)"

; 26 pt state word: the biggest thing on the card, as requested.
[MeterState]
Meter=String
FontFace=#Face#
FontSize=#SizeBig#
FontColor=#ColorValue#
StringStyle=Bold
X=#Pad#
Y=24
Text="[mStateWord]"
AntiAlias=1
Group=StateBits
DynamicVariables=1

; project (category colour) then " - " then app (label grey)
[MeterProject]
Meter=String
MeterStyle=StyleLabel
FontColor=#ColorValue#
X=#Pad#
Y=62
Text="[mProject]"
ToolTipText="Category - same names, rules and colours as ActivityWatch"
DynamicVariables=1

[MeterApp]
Meter=String
MeterStyle=StyleLabel
X=8R
Y=62
Text=" - [mApp]"
DynamicVariables=1

; ---------------------------------------------------------------------------
; The ring. 132 px circle, 9 px thick, starting at 12 o'clock.
; ---------------------------------------------------------------------------
[MeterRingTrack]
Meter=Roundline
MeasureName=mRingFull
X=56
Y=89
W=132
H=132
LineStart=55
LineLength=64
StartAngle=-1.5708
RotationAngle=6.2832
LineColor=#ColorRingTrack#
Solid=1
AntiAlias=1
LeftMouseUpAction=[!CommandMeasure cmdHold Run]
ToolTipText="Click the timer: manual hold on/off (cyan ring = override)"

; Cyan override ring, outside the timer. Hidden until the hold is on; the
; extra circle is the at-a-glance signal that the stretch is being held
; manually and play apps no longer end it.
[MeterHoldRing]
Meter=Roundline
MeasureName=mRingFull
X=48
Y=81
W=148
H=148
LineStart=71
LineLength=74
StartAngle=-1.5708
RotationAngle=6.2832
LineColor=#ColorHoldBlue#
Solid=1
AntiAlias=1
Hidden=1
LeftMouseUpAction=[!CommandMeasure cmdHold Run]
ToolTipText="Manual override is on. Click to return to automatic tracking"

[MeterRingProgress]
Meter=Roundline
MeasureName=mTimerRing
X=56
Y=89
W=132
H=132
LineStart=55
LineLength=64
StartAngle=-1.5708
RotationAngle=6.2832
LineColor=0,225,255,255
Solid=1
AntiAlias=1
LeftMouseUpAction=[!CommandMeasure cmdHold Run]
ToolTipText="Click the timer: manual hold on/off (cyan ring = override)"

; MM:SS in the middle of the ring; colour is repainted by timer.lua with the
; same tone as the arc.
[MeterRingTime]
Meter=String
MeasureName=mTimerText
FontFace=#Face#
FontSize=30
FontColor=#ColorValue#
FontWeight=600
StringAlign=CenterCenter
X=122
Y=155
Text="%1"
AntiAlias=1
LeftMouseUpAction=[!CommandMeasure cmdHold Run]
ToolTipText="Click the timer: manual hold on/off (cyan ring = override)"

[MeterRingCap]
Meter=String
FontFace=#Face#
FontSize=7
FontColor=#ColorLabel#
StringAlign=CenterCenter
X=122
Y=179
Text="OF 25 MIN"
AntiAlias=1

; --- today / seated -------------------------------------------------------
[MeterTodayLabel]
Meter=String
MeterStyle=StyleLabel
X=#Pad#
Y=236
Text="TODAY"

[MeterTodayValue]
Meter=String
MeterStyle=StyleLabel
FontColor=#ColorValue#
X=58
Y=236
Text="[mWorkToday]"
DynamicVariables=1

[MeterSeatedLabel]
Meter=String
MeterStyle=StyleLabel
X=146
Y=236
Text="SEATED"

; Colour is driven by [mBreakTone]: white when fine, red at the break point.
[MeterSeated]
Meter=String
MeterStyle=StyleLabel
FontColor=#ColorGood#
StringAlign=Right
X=(#W#-#Pad#)
Y=236
Text="[mSeated]"
DynamicVariables=1

; --- bottom row: two chips ------------------------------------------------
[chipStood]
Meter=Image
MeterStyle=styleChip
X=#Pad#
Y=264
W=52
LeftMouseUpAction=[!CommandMeasure cmdStand Run]
ToolTipText="I stood up (reset the seated timer)"

[MeterStood]
Meter=String
MeterStyle=styleBtn
X=19
Y=267
W=52
Text="STOOD"
LeftMouseUpAction=[!CommandMeasure cmdStand Run]

[chipHold]
Meter=Image
MeterStyle=styleChip
X=152
Y=264
W=78
LeftMouseUpAction=[!CommandMeasure cmdHold Run]
ToolTipText="Keep working: while on, Discord/Spotify do not reset the stretch"

[MeterHoldWord]
Meter=String
MeterStyle=styleBtn
X=158
Y=267
W=70
Text="[mHoldWord]"
LeftMouseUpAction=[!CommandMeasure cmdHold Run]
DynamicVariables=1
